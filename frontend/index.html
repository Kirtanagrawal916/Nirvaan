<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nirvaan | Disaster Monitoring</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="brand">

            <div class="brand-logo">
                ◒
            </div>

            <div>

                <h2>Nirvaan</h2>

                <p>
                    Satellite Based Disaster Monitoring
                </p>

            </div>

        </div>



        <!-- NAVIGATION -->

        <nav class="sidebar-nav">


            <!-- THEME SWITCHER AT TOP OF NAVIGATION -->

            <div class="sidebar-theme-section">

                <span class="theme-section-label">THEME</span>

                <div class="theme-toggle-pill">

                    <button
                        type="button"
                        class="theme-pill-btn dark-btn active"
                        data-theme-set="dark"
                        title="Dark Mode"
                    >
                        <span>🌙</span>
                        <span>Dark</span>
                    </button>

                    <button
                        type="button"
                        class="theme-pill-btn light-btn"
                        data-theme-set="light"
                        title="Light Mode"
                    >
                        <span>☀️</span>
                        <span>Light</span>
                    </button>

                </div>

            </div>


            <button
                class="nav-item active"
                data-page="dashboard"
            >

                <span class="nav-icon">⌂</span>

                <span>
                    Dashboard
                </span>

            </button>



            <button
                class="nav-item"
                data-page="satellite"
            >

                <span class="nav-icon">◇</span>

                <span>
                    Satellite Monitor
                </span>

            </button>



            <button
                class="nav-item"
                data-page="detection"
            >

                <span class="nav-icon">△</span>

                <span>
                    Disaster Detection
                </span>

            </button>



            <button
                class="nav-item"
                data-page="risk"
            >

                <span class="nav-icon">♢</span>

                <span>
                    Risk Map
                </span>

            </button>



            <button
                class="nav-item"
                data-page="alerts"
            >

                <span class="nav-icon">♧</span>

                <span>
                    Alerts
                </span>

                <span class="alert-count">
                    3
                </span>

            </button>



            <button
                class="nav-item"
                data-page="reports"
            >

                <span class="nav-icon">▤</span>

                <span>
                    Reports
                </span>

            </button>



            <button
                class="nav-item"
                data-page="history"
            >

                <span class="nav-icon">◷</span>

                <span>
                    History
                </span>

            </button>



            <button
                class="nav-item"
                data-page="settings"
            >

                <span class="nav-icon">⚙</span>

                <span>
                    Settings
                </span>

            </button>


        </nav>



        <!-- ABOUT -->

        <div class="about-box">

            <h4>
                ABOUT
            </h4>

            <p>
                Nirvaan uses AI and satellite imagery
                to detect disasters, monitor affected
                areas and generate rapid alerts.
            </p>

        </div>



        <!-- LOGOUT -->

        <button class="logout">

            ↪

            <span>
                Logout
            </span>

        </button>


    </aside>



    <!-- =====================================================
         MAIN AREA
    ====================================================== -->

    <section class="main-area">


        <!-- TOP BAR / HEADER NAVBAR -->

        <header class="topbar">


            <!-- LEFT: NIRVAAN BRAND -->

            <div class="topbar-left">

                <div class="topbar-brand">

                    <div class="topbar-brand-logo">
                        ◒
                    </div>

                    <div class="topbar-brand-text">

                        <h2>Nirvaan</h2>

                        <p>
                            Satellite Based Disaster Monitoring
                        </p>

                    </div>

                </div>

            </div>


            <!-- CENTER: NIRVAAN TOP NAVIGATION SECTIONS -->

            <nav class="topbar-center-nav">

                <button
                    class="topbar-nav-link active"
                    data-page="dashboard"
                >
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </button>

                <button
                    class="topbar-nav-link"
                    data-page="satellite"
                >
                    <span class="nav-icon">◇</span>
                    <span>Satellite Monitor</span>
                </button>

                <button
                    class="topbar-nav-link"
                    data-page="detection"
                >
                    <span class="nav-icon">△</span>
                    <span>Disaster Detection</span>
                </button>

                <button
                    class="topbar-nav-link"
                    data-page="risk"
                >
                    <span class="nav-icon">♢</span>
                    <span>Risk Map</span>
                </button>

                <button
                    class="topbar-nav-link"
                    data-page="alerts"
                >
                    <span class="nav-icon">♧</span>
                    <span>Alerts</span>
                    <span class="alert-count-badge">3</span>
                </button>

                <button
                    class="topbar-nav-link"
                    data-page="reports"
                >
                    <span class="nav-icon">▤</span>
                    <span>Reports</span>
                </button>

            </nav>


            <!-- RIGHT: THEME SWITCHER, SIGN OUT & 3-LINE MENU DROPDOWN -->

            <div class="topbar-right">

                <button
                    id="themeToggleBtn"
                    class="theme-toggle-btn"
                    type="button"
                    aria-label="Toggle light and dark theme"
                    title="Toggle Theme"
                >
                    <span class="theme-icon dark-icon">☀️</span>
                    <span class="theme-icon light-icon">🌙</span>
                    <span id="themeToggleText" class="theme-label">Light Mode</span>
                </button>

                <button
                    class="topbar-signout-btn"
                    id="signOutBtn"
                >
                    Sign Out
                </button>

                <!-- 3-LINE MENU WITH SETTINGS, ABOUT, HISTORY, FAQ -->

                <div class="menu-dropdown-wrapper">

                    <button
                        class="topbar-menu-btn"
                        id="topbarMenuBtn"
                        aria-label="Menu"
                        title="Toggle Menu"
                    >
                        ☰
                    </button>

                    <div
                        class="menu-dropdown"
                        id="menuDropdown"
                    >

                        <button
                            class="menu-dropdown-item"
                            data-page="settings"
                        >
                            <span class="menu-icon">⚙</span>
                            <span>Settings</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="about"
                        >
                            <span class="menu-icon">ℹ</span>
                            <span>About</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="history"
                        >
                            <span class="menu-icon">◷</span>
                            <span>History</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="faq"
                        >
                            <span class="menu-icon">❓</span>
                            <span>FAQ</span>
                        </button>

                    </div>

                </div>

            </div>


        </header>



        <!-- =================================================
             PAGE CONTENT
        ================================================== -->

        <main
            id="pageContent"
            class="page-content"
        >

        </main>


    </section>


</div>



<!-- JAVASCRIPT -->

<script src="data.js"></script>

<script src="api.js"></script>

<script src="script.js"></script>


</body>

</html>
