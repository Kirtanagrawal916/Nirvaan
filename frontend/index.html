<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nirvaan | Disaster Monitoring</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app" id="appLayout">

    <!-- BACKDROP FOR MOBILE DRAWER -->
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- =====================================================
         MODERN LEFT SIDEBAR NAVIGATION
    ====================================================== -->
    <aside class="sidebar" id="appSidebar">

        <!-- SIDEBAR HEADER / BRAND -->
        <div class="brand">
            <div class="brand-logo" title="NIRVAAN Geospatial Core">
                🛰️
            </div>
            <div class="brand-text">
                <h2 class="nirvaan-title">NIRVAAN</h2>
                <p class="nirvaan-tagline">Satellite Disaster Intelligence</p>
            </div>
            <button
                type="button"
                id="sidebarCollapseBtn"
                class="sidebar-collapse-btn"
                title="Toggle Sidebar (Expand/Collapse)"
                aria-label="Toggle Sidebar"
            >
                «
            </button>
        </div>

        <!-- SIDEBAR NAVIGATION -->
        <nav class="sidebar-nav" aria-label="Main Navigation">

            <div class="nav-section-title">MONITORING</div>

            <button class="nav-item active" data-page="dashboard" title="Dashboard Overview">
                <span class="nav-icon">⌂</span>
                <span class="nav-label">Dashboard</span>
            </button>

            <button class="nav-item" data-page="satellite" title="Satellite Monitor & Multi-Spectral Swaths">
                <span class="nav-icon">◇</span>
                <span class="nav-label">Satellite Monitor</span>
            </button>

            <button class="nav-item" data-page="detection" title="Live Disaster Detection & Analysis">
                <span class="nav-icon">△</span>
                <span class="nav-label">Live Detection</span>
            </button>

            <button class="nav-item" data-page="risk" title="Geospatial Risk Map">
                <span class="nav-icon">♢</span>
                <span class="nav-label">Risk Map</span>
            </button>

            <div class="nav-section-title">INTELLIGENCE</div>

            <button class="nav-item" data-page="alerts" title="Disaster Alerts">
                <span class="nav-icon">♧</span>
                <span class="nav-label">Alerts</span>
                <span class="alert-count" id="sidebarAlertCount">0</span>
            </button>

            <button class="nav-item" data-page="reports" title="SITREP Situation Reports">
                <span class="nav-icon">▤</span>
                <span class="nav-label">Reports</span>
            </button>

            <button class="nav-item" data-page="history" title="Historical Disaster Events Archive">
                <span class="nav-icon">◷</span>
                <span class="nav-label">History</span>
            </button>

            <div class="nav-section-title">SYSTEM</div>

            <button class="nav-item" data-page="settings" title="System Configuration & Preferences">
                <span class="nav-icon">⚙</span>
                <span class="nav-label">Settings</span>
            </button>

            <button class="nav-item" data-page="about" title="About Nirvaan Platform">
                <span class="nav-icon">ℹ</span>
                <span class="nav-label">About</span>
            </button>

            <button class="nav-item" data-page="faq" title="Frequently Asked Questions">
                <span class="nav-icon">❓</span>
                <span class="nav-label">FAQ</span>
            </button>

        </nav>

        <!-- SIDEBAR FOOTER / TELEMETRY BADGE -->
        <div class="sidebar-footer">
            <div class="sidebar-telemetry-badge" title="Copernicus Sentinel-2 Surface Reflectance Pipeline Active">
                <span class="telemetry-dot"></span>
                <div class="telemetry-text">
                    <span class="telemetry-title">CDSE SENTINEL-2</span>
                    <span class="telemetry-sub">Live Process API</span>
                </div>
            </div>
        </div>

    </aside>



    <!-- =====================================================
         MAIN AREA
    ====================================================== -->

    <section class="main-area">


        <!-- TOP BAR / HEADER NAVBAR -->

        <header class="topbar">


            <!-- LEFT: 3-LINE MENU BUTTON & NIRVAAN BRAND -->

            <div class="topbar-left">

                <!-- 3-LINE MENU DROPDOWN (CONTAINS ALL SECTIONS) -->

                <div class="menu-dropdown-wrapper">

                    <button
                        class="topbar-menu-btn"
                        id="topbarMenuBtn"
                        aria-label="Menu"
                        title="Toggle Navigation Menu"
                    >
                        ☰
                    </button>

                    <div
                        class="menu-dropdown left-dropdown"
                        id="menuDropdown"
                    >

                        <button
                            class="menu-dropdown-item active"
                            data-page="dashboard"
                        >
                            <span class="menu-icon">⌂</span>
                            <span>Dashboard</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="satellite"
                        >
                            <span class="menu-icon">◇</span>
                            <span>Satellite Monitor</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="detection"
                        >
                            <span class="menu-icon">△</span>
                            <span>Disaster Detection</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="risk"
                        >
                            <span class="menu-icon">♢</span>
                            <span>Risk Map</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="alerts"
                        >
                            <span class="menu-icon">♧</span>
                            <span>Alerts</span>
                            <span class="alert-count-badge" id="dropdownAlertCount">0</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="reports"
                        >
                            <span class="menu-icon">▤</span>
                            <span>Reports</span>
                        </button>

                        <div class="dropdown-divider"></div>

                        <button
                            class="menu-dropdown-item"
                            data-page="settings"
                        >
                            <span class="menu-icon">⚙</span>
                            <span>Settings</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="about"
                        >
                            <span class="menu-icon">ℹ</span>
                            <span>About</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="history"
                        >
                            <span class="menu-icon">◷</span>
                            <span>History</span>
                        </button>

                        <button
                            class="menu-dropdown-item"
                            data-page="faq"
                        >
                            <span class="menu-icon">❓</span>
                            <span>FAQ</span>
                        </button>

                    </div>

                </div>

                <div class="topbar-brand">

                    <div class="topbar-brand-logo">
                        <span class="brand-logo-icon">🛰️</span>
                    </div>

                    <div class="topbar-brand-text">

                        <h2 class="nirvaan-title">NIRVAAN</h2>

                        <p class="nirvaan-tagline">
                            Satellite Disaster Intelligence
                        </p>

                    </div>

                </div>

            </div>


            <!-- RIGHT: ALERT ICON BUTTON & THEME SWITCHER -->

            <div class="topbar-right">

                <div id="modeIndicator" class="mode-indicator live-mode" onclick="toggleAnalysisMode()" title="Live Satellite Disaster Intelligence System">
                    <span class="mode-icon">🛰️</span>
                    <span id="modeText"><strong>LIVE SYSTEM</strong></span>
                    <span class="mode-badge" id="modeBadge">ACTIVE</span>
                </div>

                <!-- ALERT BELL ICON BUTTON -->
                <button
                    class="topbar-icon-btn alert-icon-btn"
                    data-page="alerts"
                    onclick="navigateToPage('alerts')"
                    title="Disaster Alerts (3 Active)"
                    aria-label="Disaster Alerts"
                >
                    <span class="icon-bell">🔔</span>
                    <span class="alert-count-badge" id="topbarAlertCount">0</span>
                </button>

                <!-- ATTRACIVE SLIDING THEME SWITCHER -->
                <div class="theme-switch-wrapper" id="themeSwitchWrapper" title="Switch Theme (Light / Dark)">
                    <span class="theme-switch-icon sun-icon">☀️</span>
                    <button
                        id="themeToggleBtn"
                        class="theme-switch-track"
                        type="button"
                        role="switch"
                        aria-label="Toggle light and dark theme"
                    >
                        <span class="theme-switch-thumb"></span>
                    </button>
                    <span class="theme-switch-icon moon-icon">🌙</span>
                </div>

            </div>


        </header>


        <!-- PROVENANCE WARNING BANNER -->

        <div
            id="provenanceBanner"
            class="provenance-banner real-mode"
            style="display: none;"
        >
            <span class="banner-icon">ℹ️</span>
            <span class="banner-text"><strong>NO LIVE DATA AVAILABLE</strong> — Awaiting satellite observation feed.</span>
        </div>



        <!-- FUTURISTIC SATELLITE ORBIT DYNAMIC BACKGROUND -->
        <div class="space-orbit-bg-wrapper">
            <canvas id="satelliteOrbitCanvas"></canvas>
            <div class="space-orbit-overlay"></div>
        </div>

        <main
            id="pageContent"
            class="page-content"
        >

        </main>


    </section>


</div>



<!-- JAVASCRIPT -->
<script type="module" src="script.js"></script>

</body>

</html>
